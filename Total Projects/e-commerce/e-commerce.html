<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EbrahimiStore | E-Commerce</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="e-commerce.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container navbar">

            <a href="#" class="logo">
                Ebrahimi<span>Store</span>
            </a>

            <nav class="nav-links">

                <a href="#" data-page="home">Home</a>

                <a href="#" data-page="shop">Shop</a>

                <a href="#" data-page="shop" data-filter="Men">
                    Men
                </a>

                <a href="#" data-page="shop" data-filter="Women">
                    Women
                </a>

            </nav>

            <div class="nav-actions">

                <button
                    class="icon-button"
                    id="searchToggle"
                    aria-label="Search"
                >
                    🔍
                </button>

                <button
                    class="cart-button"
                    id="cartOpen"
                >
                    🛒 Cart
                    <span id="cartCount">0</span>
                </button>

                <button
                    class="menu-button"
                    id="menuToggle"
                >
                    ☰
                </button>

            </div>

        </div>

        <!-- Search -->

        <div class="search-panel" id="searchPanel">

            <div class="container">

                <input
                    type="search"
                    id="globalSearch"
                    placeholder="Search products..."
                >

            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main id="app"></main>


    <!-- ================= CART OVERLAY ================= -->

    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- ================= CART DRAWER ================= -->

    <aside
        class="cart-drawer"
        id="cartDrawer"
    >

        <div class="drawer-header">

            <h2>Your Cart</h2>

            <button
                class="close-button"
                id="cartClose"
            >
                ×
            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <div class="drawer-footer">

            <div class="total-row">

                <span>Subtotal</span>

                <strong id="cartSubtotal">
                    $0.00
                </strong>

            </div>

            <p class="muted">
                Shipping and taxes are calculated at checkout.
            </p>

            <button
                class="primary-button full-width"
                id="checkoutButton"
            >
                Checkout
            </button>

        </div>

    </aside>


    <!-- ================= TOAST ================= -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- JavaScript -->

    <script src="e-commerce.js"></script>

</body>
</html>
